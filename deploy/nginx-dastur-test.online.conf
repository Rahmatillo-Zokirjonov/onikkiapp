# On ikki test APK download page (static). Files: /opt/test-loyiha/onikki
server {
    listen 80;
    listen [::]:80;
    server_name dastur-test.online www.dastur-test.online;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://dastur-test.online$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dastur-test.online www.dastur-test.online;

    ssl_certificate     /etc/letsencrypt/live/dastur-test.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dastur-test.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/test-loyiha/onikki;
    index index.html;

    # Android recognises the file as an installable package only with this type.
    location ~ \.apk$ {
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="on-ikki.apk"';
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/dastur-test.access.log;
    error_log  /var/log/nginx/dastur-test.error.log;
}
